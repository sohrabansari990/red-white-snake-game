<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crimson Snake — Red &amp; White Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <div>
          <h1>SNAKE</h1>
          <p class="brand-sub">RED &amp; WHITE EDITION</p>
        </div>
      </div>

      <div class="scoreboard" aria-live="polite">
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat stat-level">
          <span class="stat-label">LEVEL</span>
          <span class="stat-value" id="level">1</span>
        </div>
        <div class="stat">
          <span class="stat-label">BEST</span>
          <span class="stat-value" id="high-score">0</span>
        </div>
      </div>
    </header>

    <section class="level-bar" aria-label="Level progress">
      <div class="level-meta">
        <span class="level-name" id="level-name">Level 1 &bull; Classic Arena</span>
        <span class="level-count" id="level-count">0 / 5 snacks</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="level-progress" style="width: 0%"></div>
      </div>
    </section>

    <section class="controls-bar" aria-label="Game settings">
      <div class="control-cluster">
        <div class="difficulty-group" role="group" aria-label="Speed">
          <button type="button" class="chip" data-speed="145">Slow</button>
          <button type="button" class="chip active" data-speed="110">Normal</button>
          <button type="button" class="chip" data-speed="75">Fast</button>
        </div>

        <div class="difficulty-group" role="group" aria-label="Board background">
          <button type="button" class="chip active" data-bg="grid">Grid</button>
          <button type="button" class="chip" data-bg="dots">Dots</button>
          <button type="button" class="chip" data-bg="check">Check</button>
        </div>
      </div>

      <div class="action-cluster">
        <button type="button" class="btn-outline" id="sound-btn" aria-pressed="true">Sound: On</button>
        <button type="button" class="btn-outline" id="pause-btn" disabled>Pause</button>
      </div>
    </section>

    <section class="board-wrapper">
      <canvas id="game-canvas" width="480" height="480" aria-label="Snake game board"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="overlay-kicker" id="overlay-kicker">RED &amp; WHITE EDITION</p>
          <h2 class="overlay-title" id="overlay-title">Ready to Play?</h2>
          <p class="overlay-subtitle" id="overlay-subtitle">
            Eat red snacks to grow and advance through 5+ levels. Avoid the red walls, barriers, and your own tail!
          </p>
          <button type="button" class="btn-primary" id="start-btn">Start Game</button>
          <p class="overlay-hint">Arrow Keys / WASD to Move &bull; Space to Pause</p>
        </div>
      </div>
    </section>

    <section class="touch-controls" aria-label="Touch direction pad">
      <button type="button" class="dpad-btn up" data-dir="UP" aria-label="Move Up">&#9650;</button>
      <div class="dpad-row">
        <button type="button" class="dpad-btn left" data-dir="LEFT" aria-label="Move Left">&#9664;</button>
        <button type="button" class="dpad-btn down" data-dir="DOWN" aria-label="Move Down">&#9660;</button>
        <button type="button" class="dpad-btn right" data-dir="RIGHT" aria-label="Move Right">&#9654;</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
